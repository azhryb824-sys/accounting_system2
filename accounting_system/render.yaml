services:
  # خدمة الخلفية (FastAPI)
  - type: web
    name: accounting-backend
    env: python
    rootDir: accounting_system
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: accounting-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        description: "Generate using Fernet.generate_key().decode()"
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*" # يمكن تحديثه لاحقاً برابط الـ Frontend الفعلي

  # خدمة الواجهة الأمامية (React/Vite)
  - type: web
    name: accounting-frontend
    env: node
    rootDir: accounting_system/accounting_system_frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l $PORT
    envVars:
      - key: VITE_API_BASE_URL
        value: https://accounting-backend.onrender.com # تأكد من مطابقة الاسم لرابط الـ Backend الفعلي

databases:
  - name: accounting-db
    plan: free
    databaseName: accounting_db