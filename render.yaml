services:
  # خدمة الخلفية (FastAPI)
  - type: web
    name: accounting-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: accounting-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        description: "Generate using Fernet.generate_key().decode()"
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*" # يمكن تحديثه لاحقاً برابط الـ Frontend الفعلي

  # خدمة الواجهة الأمامية (React/Vite)
  - type: web
    name: accounting-frontend
    env: static
    buildCommand: cd accounting_system_frontend && npm install && npm run build
    publishDir: accounting_system_frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: accounting-backend
          property: host
    routes:
      - type: rewrite
        source: /.*
        destination: /index.html

databases:
  - name: accounting-db
    plan: free
    databaseName: accounting_db