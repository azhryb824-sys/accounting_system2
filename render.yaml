services:
  - type: web
    name: accounting-backend
    env: python
    rootDir: accounting_system
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: accounting-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        description: "Generate using Fernet.generate_key().decode()"
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"  # لاحقًا نضع رابط الفرونت إند

databases:
  - name: accounting-db
    plan: free
    databaseName: accounting_db
